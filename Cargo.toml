[package]
name = "imgio"
version = "0.1.0"
edition = "2024"
# Core and every feature except `jpeg2000` (needs 1.92) and `avif` (needs 1.90).
rust-version = "1.88"
description = "Pure Rust GPU texture and image codecs: BC1-BC7, ETC/EAC, ASTC, PVRTC, Basis Universal encode/transcode, KTX2/KTX1/DDS, mipmaps, image files (PNG, JPEG, WebP, AVIF, EXR, TIFF, JPEG XL, ...), resize and filters."
license = "Apache-2.0"
repository = "https://github.com/qbart/imgio"
homepage = "https://github.com/qbart/imgio"
documentation = "https://docs.rs/imgio"
readme = "README.md"
keywords = ["texture", "bc7", "astc", "basis-universal", "gamedev"]
categories = ["multimedia::images", "game-development", "graphics", "rendering", "encoding"]
# Test data has its own licenses (see NOTICE.md) and is not published.
include = [
    "/src/**",
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSES/**",
    "/NOTICE.md",
    "/README.md",
    "/CHANGELOG.md",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytemuck = "1.25.2"
ruzstd = "0.9.1"
zstd-pure-rs = "0.2.0"
vas = { version = "0.42.0", features = ["alloc"] }
# Image file formats (optional, pure Rust): JPEG XL decode / lossless encode, JPEG 2000
# decode, OpenVDB zip streams.
jxl-oxide = { version = "0.12.6", optional = true, features = ["moxcms"] }
zune-jpegxl = { version = "0.5.2", optional = true, default-features = false, features = ["std", "threads"] }
zune-core = { version = "0.5.3", optional = true, default-features = false, features = ["std"] }
hayro-jpeg2000 = { version = "0.5.0", default-features = false, features = ["simd"], optional = true }
miniz_oxide = { version = "0.8.9", optional = true }
png = { version = "0.18.1", optional = true }
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"], optional = true }
color_quant = { version = "2.0.0", optional = true }
# OpenEXR (feature `exr`): the crate's default `rayon` feature decompresses blocks in parallel.
exr = { version = "1.74.2", optional = true }
# TIFF (feature `tiff`): the `tiff` crate writes files; decoding is imgio's own code on top of
# the LZW, Deflate and JPEG codecs below.
tiff = { version = "0.11.3", optional = true, default-features = false, features = ["lzw", "deflate"] }
weezl = { version = "0.1.12", optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
# Image file codecs (optional, one cargo feature per format; pure Rust, asm / C features off).
image-webp = { version = "0.2.4", optional = true }
jpeg-decoder = { version = "0.3.2", optional = true }
avif-parse = { version = "2.1.0", optional = true }
re_rav1d = { version = "0.1.3", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
ravif = { version = "0.13.0", optional = true, default-features = false, features = ["threading"] }
# Colour management (feature `color`): ICC parsing, built-in / CICP profiles, ICC writing (the
# transforms are imgio's own).
moxcms = { version = "0.8.1", optional = true, default-features = false, features = ["lut"] }

[features]
default = ["png", "jpeg", "color"]
# Image file formats backed by pure Rust crates (`imgio::file`); BMP, TGA, HDR and zfile are
# always built in.
png = ["dep:png"]
gif = ["dep:gif", "dep:color_quant"]
webp = ["dep:image-webp"]
jpeg = ["dep:jpeg-decoder"]
exr = ["dep:exr"]
tiff = ["dep:tiff", "dep:weezl", "dep:miniz_oxide", "dep:zune-jpeg"]
jxl = ["dep:jxl-oxide", "dep:zune-jpegxl", "dep:zune-core"]
jpeg2000 = ["dep:hayro-jpeg2000"]
vdb = ["dep:miniz_oxide"]
avif = ["dep:avif-parse", "dep:re_rav1d", "dep:ravif"]
# ICC / CICP colour management (`imgio::color`, pure Rust `moxcms`).
color = ["dep:moxcms"]
# The `imgio` command line tool (src/bin/imgio.rs). `cargo install imgio --all-features` for
# every file format.
cli = ["png", "jpeg", "color"]
# Vulkan texture upload (`imgio::gpu::vulkan`, port of KTX-Software vkloader.c). Vulkan and
# OpenGL are the only allowed bindings: commands are looked up at run time, nothing is linked.
vulkan = ["dep:ash", "dep:libloading"]
# OpenGL {,ES} texture upload (`imgio::gpu::gl`, port of KTX-Software glloader.c).
opengl = ["dep:libloading"]

# Neither exists on wasm, where the `vulkan` and `opengl` features are no-ops.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["std", "debug"], optional = true }
libloading = { version = "0.8.9", optional = true }

[lints.rust]
# Denied everywhere except the GPU loaders (src/gpu/vulkan.rs, src/gpu/gl.rs) and astcenc SIMD
# (see AGENTS.md rule 9).
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dev-dependencies]
bcdec_rs = "0.2.1"
# Inflates the stored uncompressed OpenVDB test file.
miniz_oxide = "0.8.9"

# GPU upload tests only (they need a real Vulkan / EGL library and skip without one).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ash = { version = "0.38.0", features = ["loaded"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8.9"

[[bin]]
name = "imgio"
required-features = ["cli"]

[[bench]]
name = "bench"
harness = false
