[package]
name = "imgio"
version = "0.0.0"
edition = "2024"
description = "Pure Rust image and GPU texture codecs: BC1-BC7, ASTC, UASTC, Basis Universal transcoding, RGBA/HDR."
license = "Apache-2.0"
repository = "https://github.com/qbart/imgio"
readme = "README.md"
keywords = ["texture", "bc7", "astc", "basis-universal", "gamedev"]
categories = ["multimedia::images", "game-development", "graphics"]
# Test data has its own licenses (see NOTICE.md) and is not published.
include = ["/src/**", "/Cargo.toml", "/LICENSE", "/LICENSES/**", "/NOTICE.md", "/README.md"]

[dependencies]
bytemuck = "1.25.2"
ruzstd = "0.9.1"
zstd-pure-rs = "0.2.0"
vas = { version = "0.42.0", features = ["alloc"] }

[features]
# Vulkan texture upload (`imgio::gpu::vulkan`, port of KTX-Software vkloader.c). Vulkan and
# OpenGL are the only allowed bindings: commands are looked up at run time, nothing is linked.
vulkan = ["dep:ash", "dep:libloading"]
# OpenGL {,ES} texture upload (`imgio::gpu::gl`, port of KTX-Software glloader.c).
opengl = ["dep:libloading"]

# Neither exists on wasm, where the `vulkan` and `opengl` features are no-ops.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["std", "debug"], optional = true }
libloading = { version = "0.8.9", optional = true }

[lints.rust]
# Denied everywhere except the GPU loaders (src/gpu/vulkan.rs, src/gpu/gl.rs) and astcenc SIMD
# (see AGENTS.md rule 9).
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dev-dependencies]
bcdec_rs = "0.2.1"

# GPU upload tests only (they need a real Vulkan / EGL library and skip without one).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ash = { version = "0.38.0", features = ["loaded"] }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8.9"

[[bench]]
name = "bench"
harness = false
